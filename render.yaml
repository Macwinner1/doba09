# Render Blueprint: the API plus its Postgres and Redis, created together.
# The frontend is deployed separately on Vercel (see frontend/vercel.json).
#
# Values marked `sync: false` are asked for when the Blueprint is first applied.

services:
  - type: web
    name: feyi-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @feyi/shared build &&
      pnpm --filter @feyi/backend build
    # Migrations run on boot: pre-deploy commands are not available on the free plan.
    startCommand: pnpm --filter @feyi/backend db:deploy && pnpm --filter @feyi/backend start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        fromDatabase:
          name: feyi-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: feyi-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # The frontend's public URL, e.g. https://quiz.askfeyi.com
      - key: CORS_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

  - type: keyvalue
    name: feyi-redis
    plan: free
    region: frankfurt
    # Live game state must never be silently evicted mid-game.
    maxmemoryPolicy: noeviction
    # Empty list: reachable only from services inside this Render account.
    ipAllowList: []

databases:
  - name: feyi-db
    plan: free
    region: frankfurt
    databaseName: feyi
    user: feyi
